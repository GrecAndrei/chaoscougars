<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaos Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="hud" class="hud" aria-live="polite">
    <!-- Mission status: intentionally the only persistent top-left element. -->
    <section id="timer-bar" class="mission-clock hidden" aria-label="Time until next chaos event">
      <div class="mission-clock__eyebrow">CHAOS RUN <span class="mission-clock__divider">/</span> NEXT EVENT</div>
      <div class="mission-clock__row">
        <span id="timer-label" class="mission-clock__time">--:--</span>
        <div class="mission-clock__track"><div id="timer-fill" class="mission-clock__fill"></div></div>
      </div>
    </section>

    <!-- Effects are grouped away from the game reticle and map. -->
    <section id="effects-region" class="effects-region" aria-label="Active chaos effects">
      <div id="effects-title" class="effects-title hidden">ACTIVE CHAOS</div>
      <div id="effects-list" class="effects-list"></div>
    </section>

    <!-- Shown only when cougars are present; it is a threat callout, not decoration. -->
    <div id="cougar-counter" class="threat-count hidden" aria-label="Active cougars">
      <span id="cougar-count" class="threat-count__value">0</span>
      <span class="threat-count__label">COUGARS NEARBY</span>
    </div>

    <!-- Voting takes priority over lesser status information and stays near the lower centre. -->
    <section id="vote-panel" class="vote-panel hidden" aria-label="Vote">
      <header class="vote-panel__header">
        <span class="vote-panel__title">SQUAD VOTE</span>
        <span id="vote-time" class="vote-panel__time">0:00</span>
      </header>
      <div id="vote-options" class="vote-options"></div>
    </section>

    <div id="hit-container" class="notice-stack" aria-live="assertive"></div>

    <!-- Full-screen treatment is reserved for mission-state changes. -->
    <section id="phase-overlay" class="phase-overlay hidden" aria-live="assertive">
      <div class="phase-overlay__rule"></div>
      <div id="phase-text" class="phase-overlay__title"></div>
      <div id="phase-sub" class="phase-overlay__detail"></div>
    </section>

    <!-- This is deliberately a plain operational tool, kept separate from player presentation. -->
    <aside id="admin-panel" class="admin-panel hidden" aria-label="Chaos control">
      <header class="admin-panel__header">
        <div>
          <div class="admin-panel__eyebrow">DEVELOPMENT TOOL</div>
          <h1 class="admin-panel__title">Chaos control</h1>
        </div>
        <button id="panel-close" class="icon-button" type="button" aria-label="Close panel">×</button>
      </header>

      <div class="admin-readout">
        <div class="readout"><span>State</span><strong id="stat-phase">LOBBY</strong></div>
        <div class="readout"><span>Difficulty</span><strong id="stat-diff">0%</strong></div>
        <div class="readout"><span>Cougars</span><strong id="stat-cougars">0</strong></div>
      </div>

      <section class="control-group">
        <h2>Mission</h2>
        <div class="button-row">
          <button class="control-button control-button--primary" data-action="start" type="button">Start run</button>
          <button class="control-button" data-action="pause" type="button">Pause</button>
          <button class="control-button" data-action="resume" type="button">Resume</button>
          <button class="control-button control-button--danger" data-action="stop" type="button">Stop</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Quick effects</h2>
        <div class="button-row">
          <button class="control-button" data-effect="low_gravity" type="button">Low gravity</button>
          <button class="control-button" data-effect="drunk" type="button">Drunk</button>
          <button class="control-button" data-effect="super_speed" type="button">Super speed</button>
          <button class="control-button" data-effect="meteor_rain" type="button">Meteors</button>
          <button class="control-button" data-effect="beyblade" type="button">Beyblade</button>
          <button class="control-button" data-effect="lsd" type="button">LSD</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Spawn</h2>
        <div class="button-row">
          <button class="control-button" data-action="spawn_cougar" type="button">Cougar</button>
          <button class="control-button" data-action="spawn_swarm" type="button">Swarm</button>
          <button class="control-button" data-action="spawn_bomber" type="button">Bomber</button>
          <button class="control-button control-button--danger" data-action="kill_cougars" type="button">Clear all</button>
        </div>
      </section>

      <form id="custom-effect-form" class="custom-effect-form">
        <label for="effect-input">Effect ID</label>
        <div>
          <input id="effect-input" type="text" autocomplete="off" placeholder="e.g. airstrike" />
          <button class="control-button control-button--primary" type="submit">Run</button>
        </div>
      </form>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
